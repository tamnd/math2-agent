      - path: nodes/~/~1a2b3c4d.md
        text: |
          ---
          tag: ~1a2b3c4d
          kind: definition
          name: Cyclic group (definition)
          aliases: [cyclic-group]
          defines: ~2b3c4d5e
          uses: [G5S1M9]
          formal:
            - system: lean4
              library: mathlib
              decl: IsCyclic
              match: exact
          ---

          ## Definition

          A [[group|G5S1M9]] $G$ is a **cyclic group** when there is an element $g$ of $G$ such that each element of $G$ is a power $g^n$ for some integer $n$.
    wrong: {from: "**cyclic group**", to: "cyclic group"}
    refuse: does not name the defined term in bold
  - decl: Nat.Prime.two_le
    kind: theorem
    module: Mathlib.Data.Nat.Prime.Defs
    type: "∀ {p : ℕ}, Nat.Prime p → 2 ≤ p"
    constants: [LE.le, Nat, Nat.Prime, OfNat.ofNat]
    files:
      nodes/P7M/P7MDF4.md: |
        ---
        tag: P7MDF4
        kind: definition
        name: Prime number (definition)
        aliases: [prime-number]
        defines: P1RM3S
        formal:
          - system: lean4
            library: mathlib
            decl: Nat.Prime
            match: exact
        ---

        ## Definition

        A **prime number** is a natural number $p$ with these properties:

        1. $p$ is greater than 1.
        2. The only positive divisors of $p$ are 1 and $p$.
      nodes/P1R/P1RM3S.md: |
