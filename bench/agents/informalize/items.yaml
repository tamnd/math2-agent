# The public items of the suite of the informalize role (corpus K7.3, K8.3). Each item is a Mathlib declaration with the record that the fake Lean environment gives for it, a work tree, and the reference writes that give the declaration its node. The types are short forms that we wrote for the suite, not the output of Lean. The last reference write has a wrong form, and the goal must refuse that form. The nodes are in our own words. The held-out items are in a private repository, and -items reads them from a file of the same form.
items:
  - decl: Subgroup.card_subgroup_dvd_card
    kind: theorem
    module: Mathlib.GroupTheory.Coset.Card
    type: "∀ {G : Type u_1} [Group G] [Fintype G] (H : Subgroup G) [Fintype H], Fintype.card H ∣ Fintype.card G"
    constants: [Dvd.dvd, Fintype.card, Group, Subgroup]
    files:
      nodes/G5S/G5S1M9.md: |
        ---
        tag: G5S1M9
        kind: definition
        name: Group
        formal:
          - system: lean4
            library: mathlib
            decl: Group
            match: exact
        ---

        ## Definition

        A **group** is a set with an associative operation, an identity and inverses.
      notation/conventions.yaml: |
        - id: group-law
          concept: G5S1M9
          default: multiplicative
          options:
            - option: multiplicative
            - option: additive
    writes:
      - path: nodes/~/~1a2b3c4d.md
        text: |
          ---
          tag: ~1a2b3c4d
          kind: statement
          role: theorem
          name: Lagrange's theorem
          uses: [G5S1M9]
          formal:
            - system: lean4
              library: mathlib
              decl: Subgroup.card_subgroup_dvd_card
              match: exact
          ---

          ## Statement

          Let $G$ be a finite [[group|G5S1M9]] and let $H$ be a subgroup of $G$. Then the order of $H$ divides the order of $G$.
    wrong: {from: "name: Lagrange's theorem", to: "name: card_subgroup_dvd_card"}
    refuse: is a Lean name
