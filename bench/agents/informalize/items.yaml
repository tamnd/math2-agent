    constants: [Group]
    files:
      nodes/G5S/G5S1M9.md: |
        ---
        tag: G5S1M9
        kind: definition
        name: Group
        formal:
          - system: lean4
            library: mathlib
            decl: Group
            match: exact
        ---

        ## Definition

