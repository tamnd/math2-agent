  - tag: 3C53TD
    goal: the node has each section, example and proof that its card asks for at W2
    files:
      nodes/3C5/3C53TD.md: |
        ---
        tag: 3C53TD
        kind: statement
        role: theorem
        name: Lagrange's theorem
        uses: [G5S1M9]
        ---

        ## Statement

        Let $G$ be a finite [[group|G5S1M9]] and let $H$ be a subgroup of $G$. Then the order of $H$ divides the order of $G$.
      nodes/G5S/G5S1M9.md: |
        ---
        tag: G5S1M9
        kind: definition
        name: Group
        ---

        ## Definition

        A **group** is a set with an associative operation, an identity and inverses.
    writes:
      - path: nodes/~/~2b3c4d5e.md
        text: |
          ---
          tag: ~2b3c4d5e
          kind: example
          name: The subgroups of the cyclic group of order 6
          illustrates: [3C53TD]
          ---

          ## Example

          The cyclic group of order 6 has subgroups of the orders 1, 2, 3 and 6, and each one divides 6.
      - path: nodes/~/~1a2b3c4d.md
        text: |
          ---
          tag: ~1a2b3c4d
          kind: proof
          name: Proof of Lagrange's theorem by cosets
          proves: 3C53TD
          uses: [G5S1M9]
          ---

          ## Proof

          1. The left cosets of $H$ partition $G$, because two cosets are equal or have no common element.
          2. The map $h \mapsto gh$ is a bijection from $H$ to $gH$, thus each coset has as many elements as $H$.
          3. Thus the order of $G$ is the number of cosets times the order of $H$, by steps 1 and 2, and the order of $H$ divides the order of $G$.
    wrong: {from: "\n1. ", to: "\n"}
    refuse: is not a list of numbered steps
