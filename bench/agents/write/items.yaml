        name: Prime number (definition)
        aliases: [prime-number]
        defines: P1RM3S
        ---

        ## Definition

        A **prime number** is a natural number $p$ with these properties:

        1. $p$ is greater than 1.
        2. The only positive divisors of $p$ are 1 and $p$.
