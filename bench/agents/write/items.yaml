# The public items of the suite of the write role (corpus K7.3, K7.5). Each item is a work tree with a target node, the goal of the job, and the reference writes that take the target to the level of the goal. The last reference write has a wrong form, and the goal must refuse that form. The nodes are in our own words. The held-out items are in a private repository, and -items reads them from a file of the same form.
