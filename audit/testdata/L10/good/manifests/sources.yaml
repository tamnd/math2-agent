    licence_read:
      at: https://example.org/euler/LICENSE
      on: "2026-09-30"
      by: a-reader
    authored: human
    channel: git
    attribution: A test book, https://example.org/euler, LicenseRef-public-domain
    approved_by: a-maintainer
