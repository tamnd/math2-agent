# The external sources of math2 and each snapshot that math2 used (spec 09.2). m2 ingest writes this file. A maintainer approves the class of each new source.
sources:
  - id: hardy
    name: A test book
    home: https://example.org/hardy
    licence: LicenseRef-public-domain
    public_domain:
      us: true
      eu: true
      basis: published in 1908, and the author died in 1947
    class: open
    licence_read:
      at: https://example.org/hardy/LICENSE
      on: "2026-09-30"
      by: a-reader
    authored: human
    channel: git
    attribution: A test book, https://example.org/hardy, LicenseRef-public-domain
    approved_by: a-maintainer
    snapshots:
      - url: https://example.org/hardy.tar.gz
        hash: blake3:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        date: "2026-10-01"
  - id: euler
    name: A test book
    home: https://example.org/euler
    licence: LicenseRef-public-domain
