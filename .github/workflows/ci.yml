name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

# No job in this workflow writes to the repository. A job that needs more access must ask for it by name.
permissions:
  contents: read

# A new push cancels the older run on the same branch. On main, each commit gets its own run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GO_VERSION: "1.27.x"

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy makes no change
        run: go mod tidy -diff
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...
      - name: coverage
        run: go tool cover -func=coverage.out | tail -1
      - name: build
        run: go build -trimpath ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      # Build the linter with the Go version above. A prebuilt binary that uses an older Go stops with an error and gives no findings.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      # govulncheck reports only the vulnerabilities that the code can reach.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # The commands that exist must work. The commands that are not written yet must exit with code 3 and name their milestone.
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: build
        run: go build -trimpath -ldflags "-X main.Version=ci" -o "$RUNNER_TEMP/m2" ./cmd/m2
      - name: help and version
        run: |
          "$RUNNER_TEMP/m2" help
          test "$("$RUNNER_TEMP/m2" version)" = "m2 ci"
      - name: two builds of the valid fixtures give the same output hash
        run: |
          a=$("$RUNNER_TEMP/m2" build -root testdata/nodes/valid -out "$RUNNER_TEMP/b1" | tail -n 1)
          b=$("$RUNNER_TEMP/m2" build -root testdata/nodes/valid -out "$RUNNER_TEMP/b2" | tail -n 1)
          echo "$a"
          test "$a" = "$b"
      - name: m2 status shows each node of the build, and an unknown tag exits with code 1
        run: |
          for f in testdata/nodes/valid/nodes/*/*.md; do
            "$RUNNER_TEMP/m2" status -root testdata/nodes/valid -out "$RUNNER_TEMP/b1" "$(basename "$f" .md)" > /dev/null
          done
          "$RUNNER_TEMP/m2" status -root testdata/nodes/valid -out "$RUNNER_TEMP/b1" Q529ES
          code=0
          "$RUNNER_TEMP/m2" status -root testdata/nodes/valid -out "$RUNNER_TEMP/b1" ZZZZZZ || code=$?
          test "$code" = 1
      - name: m2 check passes the valid fixtures and fails the broken fixtures
        run: |
          "$RUNNER_TEMP/m2" check -root testdata/nodes/valid
          code=0
          "$RUNNER_TEMP/m2" check -root testdata/nodes/broken -q > findings.txt || code=$?
          test "$code" = 1
          test -s findings.txt
      - name: m2 fmt changes the aliases to tags, and m2 check then passes
        run: |
          "$RUNNER_TEMP/m2" fmt -check -root testdata/nodes/valid
          tree="$RUNNER_TEMP/tree"
          cp -R testdata/nodes/valid "$tree"
          cp -R testdata/nodes/aliases/nodes testdata/nodes/aliases/registers "$tree"
          code=0
          "$RUNNER_TEMP/m2" fmt -check -root "$tree" || code=$?
          test "$code" = 1
          "$RUNNER_TEMP/m2" fmt -root "$tree"
          test -z "$("$RUNNER_TEMP/m2" fmt -root "$tree")"
          "$RUNNER_TEMP/m2" check -root "$tree"
      - name: m2 new makes a node, and m2 check reports only its placeholders
        run: |
          tree="$RUNNER_TEMP/new"
          path=$("$RUNNER_TEMP/m2" new -root "$tree" statement)
          test -f "$path"
          "$RUNNER_TEMP/m2" fmt -check -root "$tree"
          code=0
          "$RUNNER_TEMP/m2" check -root "$tree" -q > findings.txt || code=$?
          test "$code" = 1
          test "$(wc -l < findings.txt)" = 2
          test "$(grep -c 'has no value$' findings.txt)" = 2
      - name: m2 mint changes the two provisional ids of the valid fixtures to tags
        run: |
          tree="$RUNNER_TEMP/mint"
          cp -R testdata/nodes/valid "$tree"
          "$RUNNER_TEMP/m2" mint -root "$tree" -commit "$GITHUB_SHA" > minted.txt
          test "$(wc -l < minted.txt)" = 2
          test "$(wc -l < "$tree/registers/tags.reg")" = 2
          if grep -rqE '~[0-9a-f]{8}' "$tree"; then
            echo "a provisional id is in the tree after m2 mint"
            exit 1
          fi
          "$RUNNER_TEMP/m2" check -root "$tree" -q
      - name: m2 audit passes a good tree and fails a bad tree
        run: |
          tree="$RUNNER_TEMP/audit"
          cp -R audit/testdata/T05/good "$tree"
          "$RUNNER_TEMP/m2" audit -root "$tree" -plane nodes -q
          test -s "$tree/reports/audit/nodes.txt"
          test -s "$tree/reports/audit/nodes.json"
          cp -R audit/testdata/T05/bad "$tree-bad"
          code=0
          "$RUNNER_TEMP/m2" audit -root "$tree-bad" -rule T05 > findings.txt || code=$?
          test "$code" = 1
          test "$(grep -c ': T05: ' findings.txt)" = 2
      - name: an unknown command exits with code 2
        run: |
          code=0
          "$RUNNER_TEMP/m2" frobnicate || code=$?
          test "$code" = 2

  # The wiki of the fixtures must meet the targets of spec 13.7: the static checks of m2 site check, and the Lighthouse audits for accessibility and the time to the first paint.
  site:
    name: site targets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: build
        run: go build -trimpath -ldflags "-X main.Version=ci" -o "$RUNNER_TEMP/m2" ./cmd/m2
      - name: install Lighthouse CI
        run: npm ci --ignore-scripts --prefix .github/lighthouse
      - name: site report
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          code=0
          .github/lighthouse/report.sh "$RUNNER_TEMP/m2" "$RUNNER_TEMP/report/site-report.md" || code=$?
          cat "$RUNNER_TEMP/report/site-report.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: site-report
          path: ${{ runner.temp }}/report
          retention-days: 14

  # Spec 08.6: a computation runs with no network, on a read-only image, as an unprivileged user. The probe in sandbox/testdata tries to open sockets and to write outside the scratch area, and each try must fail. The job runs the probe on x86-64 and on arm64, with the default runtime and with gVisor.
  sandbox:
    name: sandbox (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            sha512: 7cbc2aeeee809dcccfb40e612504a1b76f2c119790cee59e482f7b35428cccc4f71705e7e322442d07d1f7d29b5d9e72e31319fc3088d6dcbec9fc7c1f0d8881
          - os: ubuntu-24.04-arm
            arch: aarch64
            sha512: 6b14b582cd3185169df54275eed8721d94c9b40e6cb1533d0d0c46573271c6d2d03db586ea1caac46a45e805797f00b115bead9fb93636a1ffa69f2430958977
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      GVISOR: "20261019"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: the default runtime
        env:
          M2_DOCKER: "1"
        run: go test -run TestDocker -count=1 -v ./sandbox
      - name: install gVisor
        env:
          ARCH: ${{ matrix.arch }}
          SHA512: ${{ matrix.sha512 }}
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o gvisor.tar.bz2 "https://storage.googleapis.com/gvisor/releases/release/$GVISOR/$ARCH/gvisor.tar.bz2"
          echo "$SHA512  gvisor.tar.bz2" | sha512sum -c -
          mkdir gvisor
          tar -xjf gvisor.tar.bz2 -C gvisor
          runsc=$(find gvisor -type f -name runsc | head -1)
          shim=$(find gvisor -type f -name containerd-shim-runsc-v1 | head -1)
          sudo install -m 0755 "$runsc" "$shim" /usr/local/bin/
          sudo /usr/local/bin/runsc install
          sudo systemctl reload docker
          docker info --format '{{range $k, $v := .Runtimes}}{{$k}} {{end}}'
      - name: gVisor
        env:
          M2_DOCKER: "1"
          M2_DOCKER_RUNTIME: runsc
        run: go test -run TestDocker -count=1 -v ./sandbox

  # M2Extract must build with the pinned toolchain, and its records must agree with the golden files on Linux. The golden files come from macOS, thus this job also checks that the hashes are the same on two machines. The replay tests run the comparator in the sandbox, thus the seed binding with a review reaches E5 here.
  lean:
    name: M2Extract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tamnd/math2
          path: math2
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: build M2Extract
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          lake-package-directory: lean
          use-mathlib-cache: false
          build: true
          test: false
          lint: false
      - name: get Mathlib for the math2 Lean package
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          lake-package-directory: math2/lean
          use-mathlib-cache: true
          build: true
          test: false
          lint: false
      # lake comparator runs the checkers in a bwrap sandbox. Ubuntu blocks the user namespaces of bwrap by default.
      - name: install bwrap for the sandbox of the comparator
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: test the fixtures, the seed, the Mathlib sample, the replay, the fidelity suite and the agent suite
        run: M2_MATH2_LEAN="$GITHUB_WORKSPACE/math2/lean" go test -count=1 -v ./lean ./build ./replay ./ingest/mathlib ./bench/fidelity ./agent/tools ./bench/agents

  workflows:
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          advanced-security: false

  # Stop a pull request that adds a dependency with a known vulnerability or a licence that is not allowed.
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0
