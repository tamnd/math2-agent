name: release

on:
  push:
    tags: ["v*"]
  # A person can build the binaries of a tag again, for example when the release of the tag has no binaries.
  workflow_dispatch:
    inputs:
      tag:
        description: "the tag to build, for example v0.2.7"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: build binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # The attestation step needs these two permissions. It signs a statement that says which commit and which run made each archive.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      # Do not use the Go build cache in a release. A cache that a pull request wrote must not go into a release binary.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false
      - name: test
        run: go test -race ./...
      - name: build
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            ext=""
            if [ "$os" = windows ]; then ext=".exe"; fi
            out="dist/m2_${VERSION}_${os}_${arch}"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w -X main.Version=${VERSION}" \
              -o "$out/m2${ext}" ./cmd/m2
            cp README.md LICENSE "$out/"
            tar -C dist -czf "${out}.tar.gz" "$(basename "$out")"
            rm -rf "$out"
          done
          cd dist && sha256sum ./*.tar.gz > checksums.txt
      # The site report tests the wiki of the fixtures against the targets of spec 13.7. A miss gives a warning and a report that says FAIL, not a failed release, because a slow runner can miss the paint target by chance.
      - name: site report
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          go build -trimpath -ldflags "-X main.Version=${VERSION}" -o "$RUNNER_TEMP/m2" ./cmd/m2
          npm ci --ignore-scripts --prefix .github/lighthouse
          .github/lighthouse/report.sh "$RUNNER_TEMP/m2" "$RUNNER_TEMP/report/site-report.md" || echo "::warning::The site misses a target. See site-report.md."
          cp "$RUNNER_TEMP/report/site-report.md" dist/
      # The fidelity report is the confusion matrix of the F1 battery on the suite of bench/fidelity (spec 17.3.1). The suite uses only the Lean core library.
      - name: install Lean for the fidelity suite
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          lake-package-directory: bench/fidelity/lean
          use-mathlib-cache: false
          build: true
          test: false
          lint: false
      - name: fidelity report
        run: go test -count=1 ./bench/fidelity -report "$GITHUB_WORKSPACE/dist/fidelity-report.md" || echo "::warning::The fidelity suite fails. See the test output."
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        # A release that a person made before the run keeps its notes and gets the binaries.
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi
