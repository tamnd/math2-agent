name: images

# Build each image of the computational engine from images/flake.nix on x86-64 and arm64, build it a second time, and check that the two builds have the same digest (spec 08.1). The last job compares the digests with manifests/images.yaml of tamnd/math2.

on:
  push:
    branches: [main]
    paths: ["images/**", ".github/workflows/images.yml"]
  pull_request:
    paths: ["images/**", ".github/workflows/images.yml"]
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        image: [m2-pari, m2-gap, m2-python, m2-smt, m2-sat, m2-lp, m2-m2, m2-sage]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          extra_nix_config: |
            sandbox = true
      - name: lock
        run: |
          if [ ! -f images/flake.lock ]; then
            echo "::warning::images/flake.lock is missing, thus this job makes it. Commit the flake.lock of the artifact."
            nix flake lock ./images
          fi
      - name: build two times
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          digest() { echo "sha256:$(tar -xOzf "$1" manifest.json | jq -r '.[0].Config' | sed 's/\.json$//; s/^blobs\/sha256\///')"; }
          nix build "./images#$IMAGE" --print-build-logs -o first
          one=$(digest first)
          nix build "./images#$IMAGE" --rebuild --print-build-logs -o second
          two=$(digest second)
          echo "$IMAGE $ARCH first $one second $two"
          if [ "$one" != "$two" ]; then
            echo "::error::$IMAGE on $ARCH has two digests: $one and $two"
            exit 1
          fi
          loaded=$(docker load -q < first | sed -n 's/^Loaded image: //p')
          id=$(docker image inspect --format '{{.Id}}' "$loaded")
          if [ "$id" != "$one" ]; then
            echo "::error::docker load gave the id $id, and the config of the image has the digest $one"
            exit 1
          fi
          size=$(docker image inspect --format '{{.Size}}' "$id")
          mkdir -p digests
          printf '%s %s %s %s\n' "$IMAGE" "$ARCH" "$one" "$size" > "digests/$IMAGE-$ARCH.txt"
          echo "| $IMAGE | $ARCH | \`$one\` | $size |" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: |
            digests/
            images/flake.lock
          retention-days: 90

  manifest:
    name: manifest
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tamnd/math2
          path: content
          sparse-checkout: manifests
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: artifacts
      - name: compare with the manifest of tamnd/math2
        run: |
          cat artifacts/*/digests/*.txt | sort > built.txt
          {
            echo "## The images"
            echo
            echo "| Image | Arch | Digest | Bytes |"
            echo "|---|---|---|---|"
            awk '{ printf "| %s | %s | `%s` | %s |\n", $1, $2, $3, $4 }' built.txt
          } >> "$GITHUB_STEP_SUMMARY"
          code=0
          while read -r image arch digest _; do
            want=$(awk -v i="$image" -v a="$arch" '$1 == "-" && $2 == "name:" { n = $3 } n == i && $1 == a":" { print $2 }' content/manifests/images.yaml 2>/dev/null)
            if [ "$want" != "$digest" ]; then
              echo "::warning::$image on $arch: manifests/images.yaml has '${want:-nothing}', and the build gives $digest"
              code=1
            fi
          done < built.txt
          if [ "$code" != 0 ]; then
            echo "Copy the digests of the summary to manifests/images.yaml of tamnd/math2." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: images
          path: built.txt
          retention-days: 90
