name: Bug
description: A command gives a wrong result, or it fails.
labels: ["type: fix"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `m2 version`.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: Write the commands that cause the problem. Write one command on each line.
      render: sh
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the full output.
    validations:
      required: true
