name: Feature
description: Propose new work for the toolchain or the agents.
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Say what you cannot do now.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Say what to change.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Write the result that shows the work is done. Make it a result that someone can check.
    validations:
      required: true
  - type: input
    id: milestone
    attributes:
      label: Milestone
      description: M0 to M5, or "after M5".
